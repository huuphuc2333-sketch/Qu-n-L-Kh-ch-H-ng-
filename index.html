
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHẬP DỮ LIỆU KHÁCH HÀNG XLN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container" id="appBox">

        <header class="topbar">
            <div>
                <h1>NHẬP DỮ LIỆU KHÁCH HÀNG</h1>
                <p>HỆ THỐNG QUẢN LÝ XỬ LÝ NỢ</p>
            </div>
        </header>

        <section class="card">

            <h2>THÔNG TIN KHÁCH HÀNG</h2>

            <form id="customerForm">

                <div class="form-grid">

                    <div>
                        <label>USER CÁN BỘ *</label>
                        <input
                            id="user_name"
                            type="text"
                            required
                            placeholder="Nhập mã USER cán bộ"
                            autocomplete="off"
                        >
                    </div>

                    <div>
                        <label>Số CIF *</label>
                        <input
                            id="cif"
                            type="text"
                            required
                            placeholder="Nhập số CIF"
                        >
                    </div>

                    <div>
                        <label>Tên khách hàng *</label>
                        <input
                            id="ten_kh"
                            type="text"
                            required
                            placeholder="Nhập tên khách hàng"
                        >
                    </div>

                    <div class="full-width">
                        <label>Địa chỉ</label>
                        <input
                            id="dia_chi"
                            type="text"
                            placeholder="Nhập địa chỉ khách hàng"
                        >
                    </div>

                    <div>
                        <label>Tổng dư nợ (VNĐ)</label>
                        <input
                            id="tong_du_no"
                            class="money-input"
                            inputmode="numeric"
                            placeholder="0"
                        >
                    </div>

                    <div>
                        <label>Gốc (VNĐ)</label>
                        <input
                            id="goc"
                            class="money-input"
                            inputmode="numeric"
                            placeholder="0"
                        >
                    </div>

                    <div>
                        <label>Lãi (VNĐ)</label>
                        <input
                            id="lai"
                            class="money-input"
                            inputmode="numeric"
                            placeholder="0"
                        >
                    </div>

                    <div class="full-width">
                        <label>Tài sản bảo đảm</label>
                        <textarea
                            id="tai_san_bao_dam"
                            rows="3"
                            placeholder="Nhập thông tin tài sản bảo đảm"
                        ></textarea>
                    </div>

                    <div>
                        <label>Giai đoạn xử lý *</label>
                        <select id="giai_doan" required>
                            <option value="">-- Chọn giai đoạn --</option>
                            <option value="Đã khởi kiện">Đã khởi kiện</option>
                            <option value="Đã thụ lý">Đã thụ lý</option>
                            <option value="Thi hành án">Thi hành án</option>
                            <option value="Đã tất toán">Đã tất toán</option>
                        </select>
                    </div>

                    <div>
                        <label>Ngày thực hiện *</label>
                        <input
                            id="ngay_thuc_hien"
                            type="date"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-primary"
                        id="saveBtn"
                    >
                        LƯU THÔNG TIN
                    </button>

                    <button
                        type="reset"
                        class="btn-secondary"
                    >
                        LÀM MỚI
                    </button>

                </div>

            </form>

            <p id="formMessage" class="message"></p>

        </section>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CẤU HÌNH SUPABASE -->
    <script src="config.js"></script>

    <!-- XỬ LÝ NHẬP LIỆU -->
    <script src="app.js"></script>

</body>
</html>
